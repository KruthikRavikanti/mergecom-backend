        category: { type: string }
        path:
          oneOf: [{ type: string }, { type: 'null' }]
        explanation: { type: string }
    MergeAnalysisItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          classification,
          category,
          confidence,
          label,
          path,
          explanation,
          oursChange,
          theirsChange,
          automaticallyResolved,
        ]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{64}$' }
        classification:
          type: string
          enum:
            [
              non_overlapping,
              compatible_overlap,
              true_conflict,
              ambiguous,
              unsupported,
            ]
        category: { type: string }
        confidence:
          type: string
          enum: [high, medium, low]
        label: { type: string }
        path: { type: string }
        explanation: { type: string }
        oursChange:
          oneOf: [{ type: string }, { type: 'null' }]
        theirsChange:
          oneOf: [{ type: string }, { type: 'null' }]
        automaticallyResolved: { type: boolean }
    MergeAnalysis:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          automaticMergeEnabled,
          automaticMergeEligible,
          summary,
          items,
          blockers,
        ]
      properties:
        schemaVersion: { type: string }
        automaticMergeEnabled: { type: boolean }
        automaticMergeEligible: { type: boolean }
        summary:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        items:
          type: array
          items: { $ref: '#/components/schemas/MergeAnalysisItem' }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/MergeAnalysisBlocker' }
    DocumentMerge:
      type: object
      additionalProperties: false
      required:
        [
          id,
          branchId,
          baseVersion,
          oursVersion,
          theirsVersion,
          note,
          mergeSchemaVersion,
          parserVersion,
          engineVersion,
          state,
          attempts,
          maxAttempts,
          nextAttemptAt,
          failureCode,
          supportTraceId,
          strategy,
          stableHash,
          warnings,
          appliedPaths,
          candidate,
          resultVersionId,
          createdAt,
          updatedAt,
          analysis,
        ]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        analysis:
          oneOf:
            - { $ref: '#/components/schemas/MergeAnalysis' }
            - { type: 'null' }
        baseVersion: { $ref: '#/components/schemas/MergeVersionReference' }
        oursVersion: { $ref: '#/components/schemas/MergeVersionReference' }
        theirsVersion: { $ref: '#/components/schemas/MergeVersionReference' }
        note: { type: string }
        mergeSchemaVersion: { type: string }
        parserVersion: { type: string }
        engineVersion: { type: string }
        state:
          type: string
          enum:
            [
              queued,
              running,
              retryable_failed,
              permanently_failed,
              manual_resolution_required,
              completed,
            ]
        attempts: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        nextAttemptAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        failureCode:
          oneOf: [{ type: string }, { type: 'null' }]
        supportTraceId: { type: string, format: uuid }
        strategy:
          oneOf: [{ type: string }, { type: 'null' }]
        stableHash:
          oneOf:
            - { type: string, pattern: '^[0-9a-f]{64}$' }
            - { type: 'null' }
        warnings:
          type: array
          items: { type: string }
        appliedPaths:
          type: array
          items: { type: string }
        candidate:
          oneOf:
            - { $ref: '#/components/schemas/MergeCandidate' }
            - { type: 'null' }
        resultVersionId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewPerson:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ReviewVersionReference:
      type: object
      additionalProperties: false
      required: [id, displayNumber, note, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayNumber: { type: integer, minimum: 1 }
        note: { type: string }
        author: { $ref: '#/components/schemas/ReviewPerson' }
        createdAt: { type: string, format: date-time }
    ReviewDecision:
      type: object
      additionalProperties: false
      required: [id, decision, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [approved, changes_requested] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    ReviewAssignment:
      type: object
      additionalProperties: false
      required: [reviewer, projectRole, decision]
      properties:
        reviewer: { $ref: '#/components/schemas/ReviewPerson' }
        projectRole:
          oneOf:
            - {
                type: string,
                enum: [project_lead, contributor, reviewer, viewer],
              }
            - { type: 'null' }
        decision:
          oneOf:
            - $ref: '#/components/schemas/ReviewDecision'
            - { type: 'null' }
    ReviewThreadAnchor:
      type: object
      additionalProperties: false
      required: [comparisonId, changeId, category, label, path]
      properties:
        comparisonId: { type: string, format: uuid }
        changeId: { type: string, pattern: '^[0-9a-f]{64}$' }
        category:
          { type: string, enum: [content, feature, structure, validation] }
        label: { type: string }
        path: { type: string }
    ReviewComment:
      type: object
      additionalProperties: false
      required: [id, author, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/ReviewPerson' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ReviewThread:
      type: object
      additionalProperties: false
      required:
        [
          id,
          anchor,
          status,
          createdBy,
          resolvedBy,
          resolvedAt,
          comments,
          canResolve,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        anchor:
          oneOf:
            - $ref: '#/components/schemas/ReviewThreadAnchor'
            - { type: 'null' }
        status: { type: string, enum: [open, resolved] }
        createdBy: { $ref: '#/components/schemas/ReviewPerson' }
        resolvedBy:
          oneOf:
            - $ref: '#/components/schemas/ReviewPerson'
            - { type: 'null' }
        resolvedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        comments:
          type: array
          items: { $ref: '#/components/schemas/ReviewComment' }
        canResolve: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewCapabilities:
      type: object
      additionalProperties: false
      required: [canCancel, canComment, canDecide]
      properties:
        canCancel: { type: boolean }
        canComment: { type: boolean }
        canDecide: { type: boolean }
    ReviewRequest:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          comparisonId,
          requestedBy,
          message,
          status,
          approvedVersion,
          assignments,
          threads,
          capabilities,
          closedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ReviewVersionReference' }
        comparisonId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        requestedBy: { $ref: '#/components/schemas/ReviewPerson' }
        message: { type: string }
        status:
          type: string
          enum: [open, approved, changes_requested, cancelled, superseded]
        approvedVersion:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, displayNumber]
              properties:
                id: { type: string, format: uuid }
                displayNumber: { type: integer, minimum: 1 }
            - { type: 'null' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/ReviewAssignment' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/ReviewThread' }
        capabilities: { $ref: '#/components/schemas/ReviewCapabilities' }
        closedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewRequest' }
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
    SignedBlobGrant:
      type: object
      additionalProperties: false
      required: [url, method, headers, expiresAt]
      properties:
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    UploadIntent:
      type: object
      additionalProperties: false
      required: [id, mode, expiresAt, branch, grant, multipart]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [single, multipart] }
        expiresAt: { type: string, format: date-time }
        branch:
          type: object
          additionalProperties: false
          required: [id, name, headVersionId]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            headVersionId:
              oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        grant:
          oneOf:
            - $ref: '#/components/schemas/SignedBlobGrant'
            - type: 'null'
        multipart:
          oneOf:
            - type: object
              additionalProperties: false
              required: [partSize, partCount]
              properties:
                partSize: { type: integer, minimum: 1 }
                partCount: { type: integer, minimum: 1 }
            - type: 'null'
    FinalizeVersionResult:
      type: object
      additionalProperties: false
      required: [outcome, replayed, currentHeadVersionId, version]
      properties:
        outcome: { type: string, enum: [created, conflict] }
        replayed: { type: boolean }
        currentHeadVersionId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        version: { $ref: '#/components/schemas/DocumentVersion' }
    DownloadGrant:
      allOf:
        - $ref: '#/components/schemas/SignedBlobGrant'
        - type: object
          required: [filename, sha256]
          properties:
            filename: { type: string }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: alive }
        service: { type: string }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, service, dependencies]
      properties:
        status: { type: string, enum: [ready, not-ready] }
        service: { type: string }
        dependencies:
          type: object
          additionalProperties: { type: string, enum: [ready, unavailable] }
