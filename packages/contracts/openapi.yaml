  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/merges/{mergeId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/MergeId'
    get:
      operationId: getDocumentMerge
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Persisted merge lifecycle and immutable source references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentMerge' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/merges/{mergeId}/candidate/download:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/MergeId'
    post:
      operationId: createMergeCandidateDownload
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Short-lived grant for an authorized retained merge candidate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadGrant' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/reviews:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listDocumentReviews
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Review requests for immutable versions of this document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createReviewRequest
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versionId, comparisonId, reviewerUserIds, message]
              properties:
                versionId: { type: string, format: uuid }
                comparisonId:
                  oneOf: [{ type: string, format: uuid }, { type: 'null' }]
                reviewerUserIds:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string, format: uuid }
                message:
                  { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
      responses:
        '200':
          description: Existing idempotent review request replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        '201':
          description: Review request created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/reviews/{reviewRequestId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ReviewRequestId'
    get:
      operationId: getReviewRequest
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Review request, assignments, immutable decisions, and discussion threads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/reviews/{reviewRequestId}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ReviewRequestId'
    post:
      operationId: recordReviewDecision
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, note]
              properties:
                decision: { type: string, enum: [approved, changes_requested] }
                note:
                  { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
      responses:
        '200':
          description: Immutable reviewer decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/reviews/{reviewRequestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ReviewRequestId'
    post:
      operationId: cancelReviewRequest
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Open review cancelled without changing its target version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/reviews/{reviewRequestId}/threads:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ReviewRequestId'
    post:
      operationId: createReviewThread
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [anchor, body]
              properties:
                anchor:
                  oneOf:
                    - $ref: '#/components/schemas/ReviewThreadAnchor'
                    - { type: 'null' }
                body:
                  { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
      responses:
        '201':
          description: General or comparison-change discussion created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/reviews/{reviewRequestId}/threads/{threadId}/comments:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ReviewRequestId'
      - $ref: '#/components/parameters/ThreadId'
    post:
      operationId: addReviewComment
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
      responses:
        '201':
          description: Append-only thread comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/reviews/{reviewRequestId}/threads/{threadId}/resolve:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ReviewRequestId'
      - $ref: '#/components/parameters/ThreadId'
    post:
      operationId: resolveReviewThread
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Discussion resolved while preserving all comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getDocumentVersion
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Exact immutable version metadata and graph links.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/versions/{versionId}/renditions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      operationId: createVersionRendition
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing immutable rendition request replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionRendition' }
        '201':
          description: Durable rendition requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionRendition' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/versions/{versionId}/rendition:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getVersionRendition
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current rendition lifecycle for the configured profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionRendition' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/versions/{versionId}/renditions/{renditionId}/grant:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
      - name: renditionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createRenditionViewGrant
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Short-lived inline PDF grant with expected integrity metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenditionViewGrant' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/versions/{versionId}/visual-data:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getVersionVisualData
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authorized structured visual payload from the normalized snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionVisualData' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/versions/{versionId}/download:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      operationId: createVersionDownloadGrant
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Authorized short-lived URL and expected SHA-256.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadGrant' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/versions/{versionId}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      operationId: restoreDocumentVersion
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHeadVersionId, note]
              properties:
                expectedHeadVersionId: { type: string, format: uuid }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Existing restore replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '201':
          description: Restore appended as a new version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        default: { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mergecom_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComparisonId:
      name: comparisonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MergeId:
      name: mergeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewRequestId:
      name: reviewRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectMembershipId:
      name: projectMembershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  requestBodies:
    ExpectedUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedUpdatedAt]
            properties:
              expectedUpdatedAt: { type: string, format: date-time }
  responses:
    ApiError:
      description: Request rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    NotificationPreferenceInput:
      type: object
      additionalProperties: false
      required:
        [
          inAppReviewActivity,
          emailReviewActivity,
          inAppDocumentActivity,
          emailDocumentActivity,
        ]
      properties:
        inAppReviewActivity: { type: boolean }
        emailReviewActivity: { type: boolean }
        inAppDocumentActivity: { type: boolean }
        emailDocumentActivity: { type: boolean }
    NotificationPreferences:
      type: object
      additionalProperties: false
      required:
        [
          inAppReviewActivity,
          emailReviewActivity,
          inAppDocumentActivity,
          emailDocumentActivity,
          emailAvailable,
          updatedAt,
        ]
      properties:
        inAppReviewActivity: { type: boolean }
        emailReviewActivity: { type: boolean }
        inAppDocumentActivity: { type: boolean }
        emailDocumentActivity: { type: boolean }
        emailAvailable: { type: boolean }
        updatedAt: { type: string, format: date-time }
    UserNotification:
      type: object
      additionalProperties: false
      required: [id, category, eventType, title, body, href, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        category:
          type: string
          enum: [review_activity, document_activity]
        eventType: { type: string }
        title: { type: string }
        body: { type: string }
        href: { type: string }
        readAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserNotification' }
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
        unreadCount: { type: integer, minimum: 0 }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    OrganizationRole:
      type: string
      enum:
        [
          owner,
          admin,
          project_lead,
          contributor,
          reviewer,
          viewer,
          external_reviewer,
        ]
    MembershipStatus:
      type: string
      enum: [active, suspended]
    ProjectRole:
      type: string
      enum: [project_lead, contributor, reviewer, viewer]
    DocumentKind:
      type: string
      enum: [presentation, spreadsheet, word_document]
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user, activeOrganization, organizations, session]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, displayName, email, emailVerified]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
            email: { type: string, format: email }
            emailVerified: { type: boolean }
        activeOrganization:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name, role, status]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                role: { $ref: '#/components/schemas/OrganizationRole' }
                status: { $ref: '#/components/schemas/MembershipStatus' }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        session:
          type: object
          additionalProperties: false
          required: [csrfToken, expiresAt]
          properties:
            csrfToken: { type: string }
            expiresAt: { type: string, format: date-time }
    Membership:
      type: object
      additionalProperties: false
      required: [id, userId, name, email, role, status, joinedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        joinedAt: { type: string, format: date-time }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        expiresAt: { type: string, format: date-time }
        acceptanceUrl: { type: string, format: uri }
        projectId: { type: string, format: uuid }
        projectRole: { $ref: '#/components/schemas/ProjectRole' }
    Project:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          clientName,
          accessRole,
          archivedAt,
          createdBy,
          createdAt,
          updatedAt,
          folderCount,
          documentCount,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clientName:
          oneOf: [{ type: string }, { type: 'null' }]
        accessRole: { $ref: '#/components/schemas/ProjectRole' }
        archivedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        folderCount: { type: integer }
        documentCount: { type: integer }
    NamedResource:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    WorkSection:
      type: string
      enum: [attention, continue, activity]
    WorkItemType:
      type: string
      enum:
        [
          assigned_review,
          changes_requested,
          awaiting_decisions,
          version_exception,
          comparison_exception,
          incoming_conflict,
          recent_comparison,
          approved_version,
          recent_version,
          recent_document,
        ]
    WorkItem:
      type: object
      additionalProperties: false
      required:
        [
          itemType,
          resourceId,
          project,
          document,
          status,
          actor,
          updatedAt,
          destination,
          actionLabel,
          section,
          priority,
          acknowledged,
        ]
      properties:
        itemType: { $ref: '#/components/schemas/WorkItemType' }
        resourceId: { type: string, format: uuid }
        project: { $ref: '#/components/schemas/NamedResource' }
        document: { $ref: '#/components/schemas/NamedResource' }
        status: { type: string }
        actor:
          oneOf:
            - { $ref: '#/components/schemas/NamedResource' }
            - { type: 'null' }
        updatedAt: { type: string, format: date-time }
        destination: { type: string }
        actionLabel: { type: string }
        section: { $ref: '#/components/schemas/WorkSection' }
        priority: { type: integer, minimum: 0 }
        acknowledged: { type: boolean }
    WorkPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkItem' }
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
    WorkspaceSearchResult:
      type: object
      additionalProperties: false
      required: [id, resourceType, name, breadcrumb, destination, updatedAt]
      properties:
        id: { type: string, format: uuid }
        resourceType: { type: string, enum: [project, folder, document] }
        name: { type: string }
        breadcrumb: { type: string }
        destination: { type: string }
        updatedAt: { type: string, format: date-time }
    RecentDocument:
      type: object
      additionalProperties: false
      required: [project, document, openedAt, destination]
      properties:
        project: { $ref: '#/components/schemas/NamedResource' }
        document:
          type: object
          additionalProperties: false
          required: [id, name, kind]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { $ref: '#/components/schemas/DocumentKind' }
        openedAt: { type: string, format: date-time }
        destination: { type: string }
    OnboardingStepKey:
