openapi: 3.1.0
info:
  title: MergeCom API
  version: 0.9.0
  description: Identity, project, immutable version, semantic comparison, conservative merge, review workflow, and notification delivery contracts.
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /auth/login:
    get:
      operationId: beginOidcLogin
      description: Starts the Microsoft Entra authorization-code flow with PKCE.
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirects to the configured Microsoft identity provider.
        '503': { $ref: '#/components/responses/ApiError' }
  /auth/callback:
    get:
      operationId: completeOidcLogin
      description: Completes the OIDC callback and redirects to the web application.
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirects to the requested application path or the login error page.
  /auth/development/session:
    post:
      operationId: createDevelopmentSession
      description: Non-production identity exchange for pre-seeded local users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identity]
              properties:
                identity:
                  type: string
                  enum:
                    [
                      alpha-owner,
                      alpha-admin,
                      alpha-project-lead,
                      alpha-contributor,
                      alpha-reviewer,
                      alpha-viewer,
                      alpha-external-reviewer,
                      beta-owner,
                    ]
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean, const: true }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /auth/office/handoff:
    post:
      operationId: createOfficeSessionHandoff
      description: Creates a short-lived, one-use handoff from an authenticated browser session.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Office session handoff created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, expiresAt]
                properties:
                  code: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /auth/office/exchange:
    post:
      operationId: exchangeOfficeSessionHandoff
      description: Atomically exchanges a one-use Office handoff for an HttpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 50, maxLength: 100 }
      responses:
        '200':
          description: Office session established.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated]
                properties:
                  authenticated: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [redirectTo]
                properties:
                  redirectTo: { type: string, format: uri }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /v1/me:
    get:
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authenticated user and active organization context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/ApiError' }
  /v1/session/organization:
    post:
      operationId: switchOrganization
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId]
              properties:
                organizationId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated active organization context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/notifications:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listNotifications
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Recipient-owned in-app notification page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/notifications/preferences:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: getNotificationPreferences
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current recipient notification preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        default: { $ref: '#/components/responses/ApiError' }
    put:
      operationId: updateNotificationPreferences
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferenceInput' }
      responses:
        '200':
          description: Notification preferences updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/NotificationId'
    post:
      operationId: markNotificationRead
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Notification marked read for its recipient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserNotification' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/notifications/read-all:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: markAllNotificationsRead
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: All visible notifications marked read.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [updatedCount]
                properties:
                  updatedCount: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listMemberships
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Memberships in the active organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: createInvitation
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { $ref: '#/components/schemas/OrganizationRole' }
                expiresInDays: { type: integer, minimum: 1, maximum: 14 }
                projectId: { type: string, format: uuid }
                projectRole: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '201':
          description: Invitation created and delivered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 20, maxLength: 256 }
      responses:
        '200':
          description: Invitation accepted once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organizationId]
                properties:
                  organizationId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships/{membershipId}/role:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      operationId: changeMembershipRole
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '204': { description: Role changed. }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships/{membershipId}/status:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      operationId: changeMembershipStatus
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MembershipStatus' }
      responses:
        '204': { description: Membership status changed. }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    delete:
      operationId: removeMembership
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Membership removed. }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listProjects
      security: [{ sessionCookie: [] }]
      parameters:
        - name: archived
          in: query
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Accessible projects in stable updated order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                clientName:
                  oneOf: [{ type: string, maxLength: 160 }, { type: 'null' }]
      responses:
        '201':
          description: Project created or idempotently replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/workspace/my-work:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listMyWork
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: section
          in: query
          schema: { $ref: '#/components/schemas/WorkSection' }
      responses:
        '200':
          description: Authorized current-state work items for the active user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkPage' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/workspace/search:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: searchWorkspaceMetadata
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 25, default: 12 }
      responses:
        '200':
          description: Accessible project, folder, and document name matches.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      { $ref: '#/components/schemas/WorkspaceSearchResult' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/workspace/recents:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listRecentDocuments
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 25, default: 10 }
      responses:
        '200':
          description: Recently opened documents owned by the active user.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecentDocument' }
        default: { $ref: '#/components/responses/ApiError' }
    put:
      operationId: recordRecentDocument
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, documentId]
              properties:
                projectId: { type: string, format: uuid }
                documentId: { type: string, format: uuid }
      responses:
        '204': { description: Recent document state updated. }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/onboarding:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: getOnboardingState
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: User-owned checklist derived from authorized persisted outcomes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingState' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/onboarding/preferences:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    patch:
      operationId: updateOnboardingPreferences
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                dismissed: { type: boolean }
                tour:
                  type: object
                  additionalProperties: false
                  required: [version, status]
                  properties:
                    version: { type: string, minLength: 1, maxLength: 80 }
                    status: { type: string, enum: [completed, skipped] }
      responses:
        '204': { description: User-owned onboarding preference updated. }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/onboarding/setup-readiness:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: getOfficeSetupReadiness
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Non-secret origins and authenticated setup readiness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficeSetupReadiness' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/onboarding/samples:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: registerSampleComparison
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [projectId, documentId, comparisonId, kind, title, description]
              properties:
                projectId: { type: string, format: uuid }
                documentId: { type: string, format: uuid }
                comparisonId: { type: string, format: uuid }
                kind: { $ref: '#/components/schemas/DocumentKind' }
                title: { type: string, minLength: 1, maxLength: 160 }
                description: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Completed tenant-local synthetic comparison registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SampleComparison' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/onboarding/feedback:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: submitProductFeedback
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rating, reason, route, resourceType, productVersion]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                reason: { $ref: '#/components/schemas/FeedbackReason' }
                comment:
                  oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }]
                route: { type: string, minLength: 1, maxLength: 500 }
                resourceType:
                  { $ref: '#/components/schemas/FeedbackResourceType' }
                productVersion: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Explicit content-free-by-default feedback submission stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductFeedback' }
        default: { $ref: '#/components/responses/ApiError' }
    get:
      operationId: exportProductFeedback
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      responses:
        '200':
          description: Owner/admin tenant-scoped operator feedback export.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductFeedback' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Project details visible to the actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
    patch:
      operationId: updateProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                name: { type: string, minLength: 1, maxLength: 160 }
                clientName:
                  oneOf: [{ type: string, maxLength: 160 }, { type: 'null' }]
      responses:
        '200':
          description: Project updated from the expected base state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: expectedUpdatedAt
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '204': { description: Project soft-deleted. }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: archiveProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedUpdate'
      responses:
        '200':
          description: Project archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: restoreProject
