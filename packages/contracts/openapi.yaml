openapi: 3.1.0
info:
  title: MergeCom API
  version: 0.3.0
  description: Identity, organization, RBAC, project, folder, and document metadata contracts.
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /auth/login:
    get:
      operationId: beginOidcLogin
      description: Starts the Microsoft Entra authorization-code flow with PKCE.
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirects to the configured Microsoft identity provider.
        '503': { $ref: '#/components/responses/ApiError' }
  /auth/callback:
    get:
      operationId: completeOidcLogin
      description: Completes the OIDC callback and redirects to the web application.
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirects to the requested application path or the login error page.
  /auth/development/session:
    post:
      operationId: createDevelopmentSession
      description: Non-production identity exchange for pre-seeded local users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identity]
              properties:
                identity:
                  type: string
                  enum:
                    [
                      alpha-owner,
                      alpha-admin,
                      alpha-project-lead,
                      alpha-contributor,
                      alpha-reviewer,
                      alpha-viewer,
                      alpha-external-reviewer,
                      beta-owner,
                    ]
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean, const: true }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [redirectTo]
                properties:
                  redirectTo: { type: string, format: uri }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /v1/me:
    get:
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authenticated user and active organization context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/ApiError' }
  /v1/session/organization:
    post:
      operationId: switchOrganization
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId]
              properties:
                organizationId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated active organization context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listMemberships
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Memberships in the active organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: createInvitation
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { $ref: '#/components/schemas/OrganizationRole' }
                expiresInDays: { type: integer, minimum: 1, maximum: 14 }
                projectId: { type: string, format: uuid }
                projectRole: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '201':
          description: Invitation created and delivered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 20, maxLength: 256 }
      responses:
        '200':
          description: Invitation accepted once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organizationId]
                properties:
                  organizationId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships/{membershipId}/role:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      operationId: changeMembershipRole
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '204': { description: Role changed. }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships/{membershipId}/status:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      operationId: changeMembershipStatus
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MembershipStatus' }
      responses:
        '204': { description: Membership status changed. }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    delete:
      operationId: removeMembership
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Membership removed. }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listProjects
      security: [{ sessionCookie: [] }]
      parameters:
        - name: archived
          in: query
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Accessible projects in stable updated order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                clientName:
                  oneOf: [{ type: string, maxLength: 160 }, { type: 'null' }]
      responses:
        '201':
          description: Project created or idempotently replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Project details visible to the actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
    patch:
      operationId: updateProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                name: { type: string, minLength: 1, maxLength: 160 }
                clientName:
                  oneOf: [{ type: string, maxLength: 160 }, { type: 'null' }]
      responses:
        '200':
          description: Project updated from the expected base state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: expectedUpdatedAt
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '204': { description: Project soft-deleted. }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: archiveProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedUpdate'
      responses:
        '200':
          description: Project archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: restoreProject
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedUpdate'
      responses:
        '200':
          description: Project restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/folders:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listFolders
      security: [{ sessionCookie: [] }]
      parameters:
        - name: parentFolderId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Child folders in stable configured order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderPage' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createFolder
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                parentFolderId:
                  oneOf: [{ type: string, format: uuid }, { type: 'null' }]
      responses:
        '201':
          description: Folder created or idempotently replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/folders/{folderId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FolderId'
    patch:
      operationId: updateFolder
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                name: { type: string, minLength: 1, maxLength: 160 }
                parentFolderId:
                  oneOf: [{ type: string, format: uuid }, { type: 'null' }]
                sortOrder: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Folder renamed, moved, or reordered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteFolder
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: expectedUpdatedAt
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '204': { description: Empty folder soft-deleted. }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/folders/{folderId}/path:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FolderId'
    get:
      operationId: getFolderPath
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Root-to-folder breadcrumb path.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FolderPathItem' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listDocuments
      security: [{ sessionCookie: [] }]
      parameters:
        - name: folderId
          in: query
          schema: { type: string, format: uuid }
        - name: archived
          in: query
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Documents in stable configured order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPage' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createDocument
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                kind: { $ref: '#/components/schemas/DocumentKind' }
                folderId:
                  oneOf: [{ type: string, format: uuid }, { type: 'null' }]
      responses:
        '201':
          description: Document record created or idempotently replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        default: { $ref: '#/components/responses/ApiError' }
    patch:
      operationId: updateDocument
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                name: { type: string, minLength: 1, maxLength: 255 }
                folderId:
                  oneOf: [{ type: string, format: uuid }, { type: 'null' }]
                sortOrder: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Document renamed, moved, or reordered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteDocument
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: expectedUpdatedAt
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '204': { description: Document soft-deleted. }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: archiveDocument
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedUpdate'
      responses:
        '200':
          description: Document archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/documents/{documentId}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: restoreDocument
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedUpdate'
      responses:
        '200':
          description: Document restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/team:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectMembers
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Active project team in stable name order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTeamPage' }
        default: { $ref: '#/components/responses/ApiError' }
    post:
      operationId: addProjectMember
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationMembershipId, role]
              properties:
                organizationMembershipId: { type: string, format: uuid }
                role: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '201':
          description: Existing organization member added to the project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTeamMember' }
        default: { $ref: '#/components/responses/ApiError' }
  /v1/organizations/{organizationId}/projects/{projectId}/team/{projectMembershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ProjectMembershipId'
    patch:
      operationId: changeProjectMemberRole
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '200':
          description: Project role changed within the organization-role cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTeamMember' }
        default: { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: removeProjectMember
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Project membership removed. }
        default: { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mergecom_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectMembershipId:
      name: projectMembershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  requestBodies:
    ExpectedUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedUpdatedAt]
            properties:
              expectedUpdatedAt: { type: string, format: date-time }
  responses:
    ApiError:
      description: Request rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    OrganizationRole:
      type: string
      enum:
        [
          owner,
          admin,
          project_lead,
          contributor,
          reviewer,
          viewer,
          external_reviewer,
        ]
    MembershipStatus:
      type: string
      enum: [active, suspended]
    ProjectRole:
      type: string
      enum: [project_lead, contributor, reviewer, viewer]
    DocumentKind:
      type: string
      enum: [presentation, spreadsheet, word_document]
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user, activeOrganization, organizations, session]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, displayName, email, emailVerified]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
            email: { type: string, format: email }
            emailVerified: { type: boolean }
        activeOrganization:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name, role, status]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                role: { $ref: '#/components/schemas/OrganizationRole' }
                status: { $ref: '#/components/schemas/MembershipStatus' }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        session:
          type: object
          additionalProperties: false
          required: [csrfToken, expiresAt]
          properties:
            csrfToken: { type: string }
            expiresAt: { type: string, format: date-time }
    Membership:
      type: object
      additionalProperties: false
      required: [id, userId, name, email, role, status, joinedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        joinedAt: { type: string, format: date-time }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        expiresAt: { type: string, format: date-time }
        acceptanceUrl: { type: string, format: uri }
        projectId: { type: string, format: uuid }
        projectRole: { $ref: '#/components/schemas/ProjectRole' }
    Project:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          clientName,
          accessRole,
          archivedAt,
          createdBy,
          createdAt,
          updatedAt,
          folderCount,
          documentCount,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clientName:
          oneOf: [{ type: string }, { type: 'null' }]
        accessRole: { $ref: '#/components/schemas/ProjectRole' }
        archivedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        folderCount: { type: integer }
        documentCount: { type: integer }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
    Folder:
      type: object
      additionalProperties: false
      required: [id, name, parentFolderId, sortOrder, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentFolderId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        sortOrder: { type: integer }
        updatedAt: { type: string, format: date-time }
    FolderPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Folder' }
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
    FolderPathItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Document:
      type: object
      additionalProperties: false
      required:
        [id, name, kind, folderId, sortOrder, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        folderId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        sortOrder: { type: integer }
        archivedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
    ProjectTeamMember:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationMembershipId,
          userId,
          name,
          email,
          organizationRole,
          role,
          addedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationMembershipId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        organizationRole: { $ref: '#/components/schemas/OrganizationRole' }
        role: { $ref: '#/components/schemas/ProjectRole' }
        addedAt: { type: string, format: date-time }
    ProjectTeamPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectTeamMember' }
        nextCursor:
          oneOf: [{ type: string }, { type: 'null' }]
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: alive }
        service: { type: string }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, service, dependencies]
      properties:
        status: { type: string, enum: [ready, not-ready] }
        service: { type: string }
        dependencies:
          type: object
          additionalProperties: { type: string, enum: [ready, unavailable] }
