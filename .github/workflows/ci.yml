name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated contracts
        run: |
          pnpm --filter @mergecom/contracts generate
          git diff --exit-code -- packages/contracts/src/generated/schema.ts

      - name: Validate Compose configuration
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml config --quiet

      - name: Validate pilot deployment contract
        run: |
          node infra/deployment/validate-config.mjs infra/deployment/.env.validation.example --allow-synthetic
          docker compose --env-file infra/deployment/.env.validation.example -f infra/deployment/compose.pilot.yaml config --quiet
          pnpm test:deployment

      - name: Check deployment Dockerfiles
        run: |
          for dockerfile in infra/deployment/Dockerfile.*; do
            docker buildx build --check --file "$dockerfile" .
          done

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        env:
          RUN_TESTCONTAINERS: 'true'
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit .NET dependencies
        run: dotnet list services/document-engine/MergeCom.DocumentEngine.sln package --vulnerable --include-transitive
