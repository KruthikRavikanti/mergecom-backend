name: mergecom-local

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/${MINIO_BUCKET}
      && mc cors set local/${MINIO_BUCKET} /config/minio-cors.xml"
    restart: 'no'
    volumes:
      - ./minio-cors.xml:/config/minio-cors.xml:ro

  mailpit:
    image: axllent/mailpit:v1.27.8
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '1025:1025'
      - '8025:8025'

  rendition-engine:
    build:
      context: ../..
      dockerfile: infra/deployment/Dockerfile.rendition-engine
    cap_drop:
      - ALL
    environment:
      RENDITION_ENGINE_INTERNAL_TOKEN: ${RENDITION_ENGINE_INTERNAL_TOKEN}
      RENDITION_FONT_PACK_VERSION: mergecom-liberation-noto-v1
      RENDITION_RENDERER_PROFILE: office-pdf-v1
      RENDITION_RENDERER_VERSION: libreoffice-bookworm-v1
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3004/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks:
      - rendition
    ports:
      - '3004:3004'
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1536m

volumes:
  minio-data:
  postgres-data:
  redis-data:

networks:
  rendition:
    internal: true
