worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  sendfile on;

  map $http_x_forwarded_proto $mergecom_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' __MERGECOM_CONNECT_ORIGIN__; font-src 'self'; img-src 'self' data: blob:; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /health/live {
      access_log off;
      default_type application/json;
      return 200 '{"service":"web","status":"alive"}';
    }

    location = /api {
      return 308 /api/;
    }

    location = /api/metrics {
      return 404;
    }

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $mergecom_forwarded_proto;
      proxy_pass http://api:3001/;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' __MERGECOM_CONNECT_ORIGIN__; font-src 'self'; img-src 'self' data: blob:; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location / {
      try_files $uri/index.html $uri $uri/ /app-shell.html;
      add_header Cache-Control "no-store";
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' __MERGECOM_CONNECT_ORIGIN__; font-src 'self'; img-src 'self' data: blob:; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }
  }
}
